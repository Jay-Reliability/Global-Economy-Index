name: Daily Economy Data Collector

on:
  schedule:
    # UTC 기준 12:00 = 한국 시간(KST) 21:00 정각 실행
    - cron: '45 10 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  collect_and_send:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # 최신 v4로 변경 (Node.js 경고 해결)

    - name: Set up Python
      uses: actions/setup-python@v5 # 최신 v5로 변경 (Node.js 경고 해결)
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Collection
      run: |
        python collector.py
